[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-bot"
version = "0.1.0"
description = "Telegram-ассистент для бизнеса на входящие обращения: база знаний, BM25, Claude, передача оператору, журнал и метрики"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.20,<4",
    "anthropic>=1.0,<2",
    "rank_bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["support_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
